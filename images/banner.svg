<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="open-toolbox">
  <title>open-toolbox — 19 local plugins for opencode Desktop v2</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="2" y="6" width="1276" height="300" rx="28"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="2" y="6" width="1276" height="300" rx="28" fill="url(#bg)" filter="url(#cardShadow)"/>

  <g clip-path="url(#cardClip)">
    <rect x="2" y="6" width="1276" height="300" fill="url(#grid)"/>
    <circle cx="160" cy="0" r="280" fill="url(#glowCyan)"/>
    <circle cx="1130" cy="320" r="320" fill="url(#glowViolet)"/>
  </g>
  <rect x="2" y="6" width="1276" height="300" rx="28" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1.5"/>
  <rect x="40" y="7.5" width="1200" height="1.4" fill="url(#topSheen)"/>

  <!-- toolbox mark: top edge aligned with the title cap height -->
  <g transform="translate(84,90)">
    <circle cx="52" cy="52" r="74" fill="url(#glowMark)"/>
    <path d="M34 32 V22 Q34 8 46 8 H58 Q70 8 70 22 V32" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <rect x="0" y="32" width="104" height="66" rx="15" fill="url(#bodyGrad)"/>
    <rect x="3" y="35" width="98" height="28" rx="12" fill="url(#glassGrad)"/>
    <line x1="8" y1="60" x2="96" y2="60" stroke="#020617" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="20" y="55" width="14" height="10" rx="3" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.1"/>
    <rect x="70" y="55" width="14" height="10" rx="3" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.1"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-1" fill="#38bdf8" opacity="0.22" filter="url(#softGlow)" textLength="510" lengthAdjust="spacingAndGlyphs">open-toolbox</text>
  <text x="232" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)" textLength="510" lengthAdjust="spacingAndGlyphs">open-toolbox</text>
    <text x="234" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="25" font-weight="500" fill="#a9bcd6" textLength="460" lengthAdjust="spacing">19 local plugins for opencode Desktop v2</text>

  <!-- terminal card -->
  <g filter="url(#termShadow)">
    <rect x="880" y="88" width="336" height="164" rx="16" fill="#070c18" stroke="#94a3b8" stroke-opacity="0.26" stroke-width="1.2"/>
    <circle cx="906" cy="114" r="6.5" fill="#f87171"/>
    <circle cx="928" cy="114" r="6.5" fill="#fbbf24"/>
    <circle cx="950" cy="114" r="6.5" fill="#34d399"/>
    <text x="904" y="150" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="16"><tspan fill="#64748b">$ </tspan><tspan fill="#e2e8f0">opencode</tspan></text>
    <text x="904" y="174" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="16"><tspan fill="#64748b">&#187; </tspan><tspan fill="#67e8f9">toolbox: 19 plugins loaded</tspan></text>
    <text x="904" y="198" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="16"><tspan fill="#64748b">&#187; </tspan><tspan fill="#34d399">/stats dashboard ready</tspan></text>
    <text x="904" y="222" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Liberation Mono', Menlo, Consolas, monospace" font-size="16" fill="#9fb3c8">&#8226; 100% local &#183; no cloud</text>
  </g>

  <!-- feature chips: same left margin as the title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    <rect x="236" y="252" width="103" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="287.5" y="275" textLength="69" lengthAdjust="spacingAndGlyphs">sessions</text>
    <rect x="351" y="252" width="96" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="399" y="275" textLength="62" lengthAdjust="spacingAndGlyphs">memory</text>
    <rect x="459" y="252" width="67" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="492.5" y="275" textLength="33" lengthAdjust="spacingAndGlyphs">plan</text>
    <rect x="538" y="252" width="91" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="583.5" y="275" textLength="57" lengthAdjust="spacingAndGlyphs">context</text>
    <rect x="641" y="252" width="95" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="688.5" y="275" textLength="61" lengthAdjust="spacingAndGlyphs">security</text>
    <rect x="748" y="252" width="71" height="36" rx="18" fill="#94a3b8" fill-opacity="0.10" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="783.5" y="275" textLength="37" lengthAdjust="spacingAndGlyphs">stats</text>
  </g>

  <text x="904" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', 'Liberation Sans', Arial, sans-serif" font-size="14" fill="#74859f">github.com/Bandonker/open-toolbox</text>
</svg>
