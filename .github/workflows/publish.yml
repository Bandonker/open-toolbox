name: publish

# Tag-driven release: pushing vX.Y.Z builds, verifies, and publishes the
# packages that are not on npm yet at that exact version, via OIDC trusted
# publishing (no npm token). Versions already on npm are skipped, so tagging a
# version that was released by hand keeps GitHub and npm in sync without
# republishing.
#
#   npm version minor   # bumps root package.json (build stamps it onto all 19)
#   git push origin main
#   git tag v1.2.0 && git push origin v1.2.0
#
# One-time setup per package (npmjs.com → package → Settings → Trusted
# publisher): GitHub Actions, this repo, workflow file "publish.yml".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:packages
      - run: npm run pack:check
      - name: Publish packages not already on npm
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VER="$(node -p "require('./package.json').version")"
          if [ "$ROOT_VER" != "$TAG" ]; then
            echo "tag v$TAG does not match root package.json version $ROOT_VER"
            exit 1
          fi
          # The tag marks the release; npm only gets what is missing. A version
          # already on npm (hand-published, or from an earlier run of this
          # workflow) is skipped, so re-tagging or tagging an already-released
          # version is a clean no-op instead of a publish conflict.
          for d in packages/*/; do
            NAME="$(node -p "require('./$d/package.json').name")"
            if npm view "$NAME@$TAG" version >/dev/null 2>&1; then
              echo "--- $NAME@$TAG already on npm, skipping ---"
              continue
            fi
            echo "--- publishing $d ---"
            (cd "$d" && npm publish --access public --provenance)
          done
